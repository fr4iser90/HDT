[package]
name = "bgc-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Battlegrounds Companion in-game overlay (tracks HS window)"

[[bin]]
name = "bgc-ui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bgc-core = { path = "../bgc-core" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.29"
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }
x11rb = { version = "0.13", default-features = false, features = ["shape", "allow-unsafe-code"] }

[workspace]
resolver = "2"
members = [
    "crates/bgc-core",
    "crates/bgc-cli",
    "crates/bgc-ui",
]
default-members = ["crates/bgc-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Patrick B."]
repository = "https://github.com/fr4iser90/HDT"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
notify = "6"
regex = "1"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = "2"
walkdir = "2"
